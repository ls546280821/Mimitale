<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mimitale · 可爱风三气质 · 静态稿</title>
<style>
/* ==========================================================================
   可爱风三气质 —— 静态设计稿（只服务出图，不参与构建）

   → 上一版把产品当成「书」做（阅读面 / 楷体旁白 / 去气泡），错了。
     这是酒馆式的角色扮演聊天：主角是**角色头像和对话气泡**。

   → 所以这一版**结构定死一套**，三个方向只改气质（配色 + 圆角力度 + 气泡形态），
     不让用户在布局上纠结：
       左 rail 224 角色列表 ｜ 中 main 对话 ｜ 右 panel 300 角色面板
     1440x900（屏幕 1920x1080，工作区 1920x1040）

   → 本机**没有圆体**（C:\Windows\Fonts 里中文字体只有 等线/黑体/楷体/宋体/仿宋/雅黑），
     可爱感只能靠「形状圆 + 配色柔 + 头像气泡主导」来做，字体统一微软雅黑。
   ========================================================================== */

*{box-sizing:border-box}
/* 出图截整个视口 → body 零留白；滚动条必须藏掉，否则占位会裁掉 frame 底部 */
html{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0}
body{margin:0;padding:0;background:#8e8e8a;display:block}

[data-dir]{
  --font-ui:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  --r-card:16px; --r-bubble:18px; --r-btn:12px; --r-pill:999px;
  --ink-faint:#7f7f7f;
}

/* ---------- ① berry 草莓奶昔：暖粉，最萌 ---------- */
[data-dir="berry"]{
  --bg:#fff5f8; --rail:#ffeef4; --sheet:#ffffff; --sheet-2:#fff7fa;
  --line:#f8dee8; --line-2:#f0cbd9;
  --ink:#2b1f26; --ink-dim:#5f4f58; --ink-faint:#7f6f78;
  --accent:#d92968; --accent-soft:rgba(217,41,104,.10);
  --bubble:#ffffff; --bubble-me:#ffd9e6; --bubble-me-ink:#8a1543;
  --shadow:0 2px 10px rgba(217,41,104,.10);
  --shadow-lg:0 6px 22px rgba(217,41,104,.14);
  --logo-g:#ff9dc4,#c78cff;
}
/* ---------- ② soda 苏打气泡：清爽蓝 ---------- */
[data-dir="soda"]{
  --bg:#f4f9ff; --rail:#e8f3fd; --sheet:#ffffff; --sheet-2:#f7fbff;
  --line:#dceaf7; --line-2:#c6ddf1;
  --ink:#16222e; --ink-dim:#4a6076; --ink-faint:#63788e;
  --accent:#1670b8; --accent-soft:rgba(22,112,184,.10);
  --bubble:#ffffff; --bubble-me:#d3e9ff; --bubble-me-ink:#0d4a7a;
  --shadow:0 2px 10px rgba(22,112,184,.10);
  --shadow-lg:0 6px 22px rgba(22,112,184,.14);
  --logo-g:#7cc4ff,#4d8cff;
}
/* ---------- ③ matcha 抹茶奶绿：温柔绿 ---------- */
[data-dir="matcha"]{
  --bg:#f4fbf7; --rail:#e9f7ef; --sheet:#ffffff; --sheet-2:#f7fdfa;
  --line:#d9eee3; --line-2:#c3e4d3;
  --ink:#182a22; --ink-dim:#4b6558; --ink-faint:#5b7869;
  --accent:#1a7d52; --accent-soft:rgba(26,125,82,.10);
  --bubble:#ffffff; --bubble-me:#cdeedd; --bubble-me-ink:#0c4a30;
  --shadow:0 2px 10px rgba(26,125,82,.10);
  --shadow-lg:0 6px 22px rgba(26,125,82,.14);
  --logo-g:#7fe0b4,#3fb98a;
}

/* ---------- frame ---------- */
.frame{
  width:1440px;height:900px;display:flex;overflow:hidden;position:relative;
  background:var(--bg);color:var(--ink);
  font-family:var(--font-ui);font-size:14px;line-height:1.6;
}
.frame *{min-width:0}
.sp{flex:1}

/* ---------- 头像（角色自身的视觉，三方向共用） ---------- */
.ava{
  border-radius:50%;display:grid;place-items:center;color:#fff;
  font-weight:600;flex:0 0 auto;position:relative;letter-spacing:.02em;
}
/* 渐变色板刻意不带 .ava 前缀 —— 头像、卡片脸、大预览脸、「我」都是同一套。
   前缀限死在 .ava 上时，.kface.g3 / .p-ava.g1 / .prev-face.g3 全都拿不到背景，
   表现为「透明圆 + 白字」，在白卡片上直接隐形。 */
.g1{background:linear-gradient(135deg,#ffb0d0,#b98cff)}
.g2{background:linear-gradient(135deg,#b9f0d8,#5fd6a8)}
.g3{background:linear-gradient(135deg,#ffd9a8,#ffab5e)}
.g4{background:linear-gradient(135deg,#c8d4ff,#8a9dff)}
.g5{background:linear-gradient(135deg,#e0d4ff,#a98cff)}
.g6{background:linear-gradient(135deg,#ffc9c9,#ff8f8f)}
.gme{background:linear-gradient(135deg,#9fd4ff,#6aa8ff)}
.ava.sm{width:38px;height:38px;flex-basis:38px;font-size:15px}
.ava.lg{width:44px;height:44px;flex-basis:44px;font-size:17px}
.online{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
  background:#3fc98a;border:2.5px solid var(--rail)}
/* 世界书会话的图标是**方的**，角色对话是圆的 —— 形状本身就是分类，不用再挂标签。
   给「书」单开一条：直接改 .ava 的圆角，别动尺寸（尺寸有 .sm/.lg 在管）。 */
.ava.book{border-radius:11px}
.ava.lg.book{border-radius:14px}

/* ---------- 左栏：角色列表 ---------- */
.rail{width:224px;flex:0 0 224px;background:var(--rail);display:flex;flex-direction:column;padding:16px 12px 14px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 16px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--logo-g));
  color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.bname{font-size:14.5px;font-weight:600;letter-spacing:.04em}
.new-btn{width:100%;height:40px;border:0;border-radius:var(--r-btn);background:var(--accent);
  color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-ui);
  margin-bottom:10px;box-shadow:var(--shadow)}
.search{height:36px;border-radius:var(--r-pill);background:var(--sheet);display:flex;align-items:center;
  gap:8px;padding:0 13px;font-size:12.5px;color:var(--ink-faint);margin-bottom:14px}
.rail-cap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-faint);
  letter-spacing:.1em;padding:0 8px 8px}
.rlist{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:12px;cursor:pointer}
.ritem:hover{background:var(--sheet)}
.ritem.on{background:var(--sheet);box-shadow:var(--shadow)}
.rinfo{overflow:hidden}
.rname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rail-foot{padding-top:10px}
/* flex 居中是为了带图标的 ghost-btn —— svg 是 inline，靠 baseline 对齐总差半像素 */
.ghost-btn{width:100%;height:36px;border:0;border-radius:var(--r-btn);background:var(--sheet);
  color:var(--ink-dim);font-size:12.5px;cursor:pointer;font-family:var(--font-ui);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.ghost-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- 中栏 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:12px;padding:0 24px;
  border-bottom:1px solid var(--line)}
.tinfo{overflow:hidden}
.tname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.pill-tag{font-size:10.5px;font-weight:400;padding:1px 8px;border-radius:var(--r-pill);
  background:var(--accent-soft);color:var(--accent)}
.tsub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{height:34px;border:0;border-radius:var(--r-btn);background:transparent;padding:0 12px;
  font-size:12.5px;color:var(--ink-dim);cursor:pointer;font-family:var(--font-ui);
  display:flex;align-items:center;gap:6px}
.ic-btn:hover{background:var(--accent-soft);color:var(--accent)}

.chat{flex:1;overflow:hidden;padding:22px 24px 0;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:flex-start}
.row.me{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:7px;max-width:620px}
.bubble{background:var(--bubble);border-radius:var(--r-bubble);border-top-left-radius:6px;
  padding:12px 16px;box-shadow:var(--shadow);font-size:15px;line-height:1.72}
.bubble p{margin:0 0 .42em}
.bubble p:last-child{margin-bottom:0}
.bubble.me{background:var(--bubble-me);color:var(--bubble-me-ink);border-radius:var(--r-bubble);
  border-top-right-radius:6px;box-shadow:none}
.acts{display:flex;gap:14px;padding-left:4px}
.acts button{background:none;border:0;padding:0;font-size:11.5px;color:var(--ink-faint);
  cursor:pointer;font-family:var(--font-ui)}
.acts button:hover{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:6px;max-width:520px}
.opt{text-align:left;border:0;border-radius:var(--r-btn);background:var(--sheet);padding:9px 14px;
  font-size:13.5px;color:var(--ink-dim);cursor:pointer;font-family:var(--font-ui);
  box-shadow:var(--shadow);display:flex;align-items:center;gap:9px}
.opt:hover{color:var(--accent)}
.opt i{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 5px}

.compose{flex:0 0 auto;padding:14px 24px 18px}
.cin{display:flex;align-items:center;gap:9px}
.field{flex:1;height:48px;border-radius:var(--r-pill);background:var(--sheet);display:flex;
  align-items:center;gap:10px;padding:0 8px 0 16px;box-shadow:var(--shadow)}
.ph{flex:1;font-size:14px;color:var(--ink-faint)}
.ic-round{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--ink-faint);
  cursor:pointer;display:grid;place-items:center}
.ic-round:hover{background:var(--accent-soft);color:var(--accent)}
.send{height:48px;padding:0 26px;border:0;border-radius:var(--r-pill);background:var(--accent);
  color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-ui);
  box-shadow:var(--shadow)}

/* ---------- 右栏：角色面板 ---------- */
.panel{width:300px;flex:0 0 300px;background:var(--rail);display:flex;flex-direction:column;
  padding:22px 18px 16px;overflow:hidden}
.p-ava{width:88px;height:88px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  color:#fff;font-size:34px;font-weight:600;position:relative}
.p-ava .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--sheet)}
.p-name{text-align:center;font-size:16px;font-weight:600;margin-top:13px}
.p-tags{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.p-tags span{font-size:11px;padding:2px 9px;border-radius:var(--r-pill);background:var(--sheet);color:var(--ink-dim)}
.p-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.7;text-align:center;margin-top:12px;
  padding:0 6px}
.stats{margin-top:16px;padding-top:6px;border-top:1px solid var(--line-2);flex:1;overflow:hidden}
.s-cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.12em;margin:13px 0 9px}
.s-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
.s-row b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sheet);overflow:hidden;margin-bottom:11px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.panel-foot{padding-top:12px}

/* ---------- 右栏 · 在场角色（世界书 / 多角色时用） ----------
   一张面板只能服务单角色聊天。世界书游玩时场上会有好几张卡，
   所以右栏改成「头像行 + 可折叠卡列表」：单角色时就一张展开卡（观感和原来一样），
   多角色时收成一组，点谁展开谁。 */
.cast-cap{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-faint);
  letter-spacing:.12em}
.cast-cap b{font-weight:600;color:var(--accent);font-size:11px}
.cast-top{display:flex;align-items:center;gap:6px;padding:0 4px 9px}
.cc-all{font-size:10.5px;color:var(--ink-faint);background:none;border:0;cursor:pointer;
  font-family:var(--font-ui);padding:0}
.cc-all:hover{color:var(--accent)}
/* gap 给 10px 而不是 7px：.cav.on 的环往外扩 4.5px，7px 时两枚头像会挤在一起 */
.cast-avatars{display:flex;gap:10px;padding:0 2px 14px;border-bottom:1px solid var(--line-2)}
.cav{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:600;position:relative;cursor:pointer}
.cav.on{box-shadow:0 0 0 2.5px var(--rail),0 0 0 4.5px var(--accent)}
.cast-list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.ccard{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ccard.open{box-shadow:var(--shadow-lg)}
.cc-head{display:flex;align-items:center;gap:9px;padding:9px 11px}
.cc-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-tag{font-size:10px;font-weight:400;padding:1px 7px;border-radius:var(--r-pill);
  background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.cc-tog{font-size:11px;color:var(--ink-faint);background:none;border:0;cursor:pointer;
  font-family:var(--font-ui);flex:0 0 auto;padding:2px 0 2px 4px}
.cc-body{padding:2px 11px 12px}
.cc-body .s-cap{margin-top:11px}
.cc-body .s-cap:first-child{margin-top:2px}

/* 旁白有两种，别合并：
   · .narration = 场景切换 / 时间跳跃的一句短提示（居中 + 两侧短线）
   · .gm        = GM 叙述的整段话（无气泡、左侧一条线）
   共同点是**都没有气泡** —— 「有气泡 = 有人在说话」这条语义要守住，
   玩家才有办法一眼分清「谁在说」和「叙述者在说」。 */
.narration{display:flex;align-items:center;gap:11px;padding:2px 4px}
.narration i{height:1px;flex:0 0 24px;background:var(--line-2);border-radius:1px}
.narration span{flex:1;text-align:center;font-size:12.5px;color:var(--ink-faint);line-height:1.8}

.gm{font-size:14.5px;line-height:1.9;color:var(--ink-dim);padding:1px 4px 1px 14px;
  border-left:2px solid var(--line-2)}

/* 多人同场（世界书）才在气泡上写名字；单角色聊天看头像就够，别加噪音。
   左内边距 16px = 气泡的 padding-left，名字才和气泡里的字对齐成一列。 */
.mname{font-size:11.5px;color:var(--ink-faint);padding-left:16px}

/* ---------- 角色库页 ---------- */
.page{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.phead{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:12px;padding:0 24px;
  border-bottom:1px solid var(--line)}
.ptitle{font-size:17px;font-weight:600}
.psub{font-size:12px;color:var(--ink-faint)}
.pbody{flex:1;overflow:hidden;padding:20px 24px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kcard{background:var(--sheet);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);
  cursor:pointer;display:flex;flex-direction:column}
.kcard:hover{box-shadow:var(--shadow-lg)}
.khead{display:flex;gap:12px;align-items:center}
/* flex:0 0 auto —— 不要写死 flex-basis，否则内联 style="width:96px" 会被它压回去，
   大头像变成 54x96 的竖椭圆 */
.kface{width:54px;height:54px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:22px;font-weight:600}
.kname{font-size:15px;font-weight:600}
.ktags{font-size:11px;color:var(--ink-faint);margin-top:3px}
.kdesc{font-size:12.5px;color:var(--ink-dim);line-height:1.7;margin-top:12px;flex:1;min-height:3.4em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kfoot{display:flex;gap:12px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.kfoot button{background:none;border:0;padding:0;font-size:12px;color:var(--ink-faint);
  cursor:pointer;font-family:var(--font-ui)}
.kfoot button.acc{color:var(--accent);font-weight:600}

/* ---------- 角色卡编辑页 ---------- */
.form{flex:1;overflow:hidden;padding:20px 24px}
.sheet{background:var(--sheet);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow)}
.lbl{display:block;font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:7px}
.inp{width:100%;height:42px;border:1.5px solid var(--line);border-radius:11px;background:var(--sheet-2);
  color:var(--ink);font-family:var(--font-ui);font-size:13.5px;padding:0 14px;display:flex;align-items:center}
.inp.ph2{color:var(--ink-faint)}
textarea.inp{height:auto;padding:11px 14px;line-height:1.75;resize:none;display:block}
.tabs{display:flex;gap:6px;align-items:center;margin:16px 0 12px}
.tab{padding:7px 14px;border:0;border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-dim);
  background:var(--sheet-2);cursor:pointer;font-family:var(--font-ui)}
.tab.on{background:var(--accent);color:#fff;font-weight:600}
.arow{display:grid;grid-template-columns:1fr 96px 1.2fr 108px 30px;gap:10px;align-items:center;margin-bottom:9px}
.arow .inp{height:38px}
.more{width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--ink-faint);
  cursor:pointer;display:grid;place-items:center}
.more:hover{background:var(--accent-soft);color:var(--accent)}

/* 右栏预览 */
.prev-box{background:var(--sheet);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.prev-cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.12em;text-align:center;margin-bottom:12px}
.prev-face{width:66px;height:66px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  color:#fff;font-size:26px;font-weight:600}
.prev-name{text-align:center;font-size:14.5px;font-weight:600;margin-top:10px}
.prev-tags{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:4px}
.prev-desc{font-size:12px;color:var(--ink-dim);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ============================================================================
//  静态稿渲染。三方向结构完全一致，只有 data-dir 不同 —— 便于横向对比气质。
//  文案三份一致：对比时只看设计，不看内容。
// ============================================================================

const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.8" cy="8.8" r="1.6"/><path d="m21 15-4.5-4.5L5.5 21"/>',
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>',

  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>',

/* 消息渲染器：单角色聊天和世界书共用一套。
   条目格式 ——
     ['gm', 文字]                  无气泡的 GM 叙述段
     ['nar', 文字]                 场景切换的居中短提示
     ['me', [段落...]]             玩家自己的话
     ['ai', 名字, 渐变色, [段落...], 要不要写名字]
   actsAt / optsAt 是「第几条后面挂操作条 / 选项条」，-1 表示不挂。 */
function renderMsgs(list, actsAt, optsAt){
  return list.map((m, i)=>{
    const kind = m[0];
    if (kind === 'nar') return `<div class="narration"><i></i><span>${m[1]}</span><i></i></div>`;
    if (kind === 'gm')  return `<div class="gm">${m[1]}</div>`;

    const extra =
      i === actsAt ? `<div class="acts"><button>复制</button><button>重说</button><button>配图</button><button>分支</button></div>`
      : i === optsAt ? `<div class="opts">${OPTS.map((o)=>`<button class="opt"><i></i>${o}</button>`).join('')}</div>`
      : '';

    const wrap = (paras)=>paras.map((p)=>`<p>${p}</p>`).join('');

    if (kind === 'me') {
      return `<div class="row me">
        <div class="col"><div class="bubble me">${wrap(m[1])}</div></div>
        <div class="ava gme sm">我</div>
      </div>`;
    }

    const name = m[1], g = m[2];
    return `<div class="row">
      <div class="ava ${g} sm">${name.charAt(0)}</div>
      <div class="col">
        ${m[4] ? `<div class="mname">${name}</div>` : ''}
        <div class="bubble">${wrap(m[3])}</div>${extra}
      </div>
    </div>`;
  }).join('');
}
