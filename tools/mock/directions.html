<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mimitale · 三个设计方向对比稿</title>
<style>
/* ==========================================================================
   三个方向对比稿 —— 静态设计稿，只服务「出图给人看」，不参与构建。

   每个方向 = 一套完整 token（配色 + 字体角色 + 圆角/层次）+ 一套布局主张。
   frame 固定 1180x800 = 真实窗口尺寸（main/window.js:70）。
   data-shot 命名 A1..A4 / B1..B4 / C1..C4，出图脚本按它命名文件。

   三方向的差异写在三处，不是换皮：
     1) 明暗立场   A 浅 / B 深（默认） / C 浅
     2) 结构主张   A 单栏宽阅读 / B 对话+浮卡 / C 三栏常驻数据栏
     3) 字体角色   A 雅黑 / B 楷体 / C 宋体
   ========================================================================== */

*{box-sizing:border-box}
/* 出图脚本截整个视口 → body 必须零留白，且滚动条必须藏掉（占位会裁掉 frame 底部） */
html{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0}
body{margin:0;padding:0;background:#8e8e8a;display:block}

[data-dir]{
  --font-ui:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  --r:10px;--r-sm:7px;
}

/* ---------- 方向 A｜墨白：冷灰纸台 + 纯白承载面 + 松绿一点 ---------- */
[data-dir="A"]{
  --bg:#f4f4f2; --sheet:#ffffff; --sheet-2:#f8f8f6;
  --line:#e7e6e2; --line-strong:#d3d2cd;
  --ink:#17191b; --ink-dim:#565b61; --ink-faint:#676d73;
  --accent:#2f6b4f; --accent-soft:rgba(47,107,79,.09); --accent-line:rgba(47,107,79,.32);
  --font-read:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
/* ---------- 方向 B｜夜航：墨蓝黑为底，琥珀为灯，楷体阅读 ---------- */
[data-dir="B"]{
  --bg:#0f1216; --sheet:#151a1f; --sheet-2:#1b2127;
  --line:#252c34; --line-strong:#333c46;
  --ink:#e2e6ea; --ink-dim:#9aa2aa; --ink-faint:#838b93;
  --accent:#d99a3f; --accent-soft:rgba(217,154,63,.13); --accent-line:rgba(217,154,63,.36);
  --on-accent:#1a1206;
  --font-read:KaiTi,"楷体","STKaiti","Kaiti SC",serif;
}
/* ---------- 方向 C｜台账：冷蓝灰 + 石板青，宋体印刷感，密度最高 ---------- */
[data-dir="C"]{
  --bg:#e9ecef; --sheet:#ffffff; --sheet-2:#f2f4f6;
  --line:#d9dee3; --line-strong:#c2cad2;
  --ink:#16191d; --ink-dim:#4e565e; --ink-faint:#666c72;
  --accent:#33697d; --accent-soft:rgba(51,105,125,.09); --accent-line:rgba(51,105,125,.32);
  --font-read:SimSun,"宋体","Songti SC",serif;
}
[data-dir="A"],[data-dir="C"]{--on-accent:#fff}

/* ---------- frame ---------- */
.frame{
  width:1180px;height:800px;display:flex;overflow:hidden;position:relative;
  background:var(--bg);color:var(--ink);
  font-family:var(--font-ui);font-size:14px;line-height:1.6;
}
.frame *{min-width:0}
.sp{flex:1}

/* ==========================================================================
   A｜墨白
   ========================================================================== */
.a-rail{width:64px;flex:0 0 64px;display:flex;flex-direction:column;align-items:center;padding:16px 0 14px}
.a-logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.a-rail-g{display:flex;flex-direction:column;gap:4px;margin-top:16px}
.a-rail-g.bottom{margin-top:auto}
.a-rail-btn{width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink-faint);cursor:pointer;display:grid;place-items:center}
.a-rail-btn:hover{background:var(--accent-soft);color:var(--ink)}
.a-rail-btn.on{background:var(--accent-soft);color:var(--accent)}
.a-me{width:32px;height:32px;border-radius:50%;background:var(--sheet);border:1px solid var(--line);color:var(--ink-dim);display:grid;place-items:center;font-size:13px}

.a-main{flex:1;display:flex;flex-direction:column;background:var(--sheet);position:relative}
.a-top{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:6px;padding:0 30px}
.a-title{font-size:15px;font-weight:500}
.a-sub{font-size:11.5px;color:var(--ink-faint);margin-top:3px;display:flex;gap:6px}
.a-tb{height:30px;border:0;border-radius:7px;background:none;padding:0 10px;font-size:12.5px;color:var(--ink-faint);cursor:pointer;font-family:var(--font-ui);display:flex;align-items:center;gap:6px}
.a-tb:hover{background:var(--accent-soft);color:var(--accent)}

.a-scroll{flex:1;overflow:hidden;padding:4px 30px 0}
.a-read{max-width:712px;margin:0 auto}
.a-msg{margin-bottom:34px}
.a-msg.me{padding-left:48px}
.a-who{font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:9px}
.a-prose{font-family:var(--font-read);font-size:17px;line-height:2;color:var(--ink);letter-spacing:.012em}
.a-prose p{margin:0 0 .45em}
.a-prose p:last-child{margin-bottom:0}
.a-say{font-size:15px;line-height:1.95;color:var(--ink-dim)}
.a-acts{display:flex;gap:16px;margin-top:15px}
.a-acts button{background:none;border:0;padding:0;font-size:11.5px;color:var(--ink-faint);cursor:pointer;font-family:var(--font-ui)}
.a-acts button:hover{color:var(--accent)}
.a-opts{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.a-opt{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink-dim);cursor:pointer;font-family:var(--font-ui)}
.a-opt:hover{background:var(--accent-soft);color:var(--accent)}
.a-opts-f{display:flex;gap:16px;padding:8px 10px 0}

.a-compose{flex:0 0 auto;padding:16px 30px 22px}
.a-cin{max-width:712px;margin:0 auto;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-strong);padding-bottom:11px}
.a-cin:focus-within{border-color:var(--accent)}
.a-ph{flex:1;font-size:15px;color:var(--ink-faint)}
.a-icb{width:26px;height:26px;border:0;background:none;color:var(--ink-faint);cursor:pointer;display:grid;place-items:center}
.a-send{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.a-hint{max-width:712px;margin:11px auto 0;font-size:11.5px;color:var(--ink-faint)}

.a-page{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.a-phead{padding:30px 30px 20px;display:flex;align-items:baseline;gap:12px}
.a-ptitle{font-size:21px;font-weight:500;letter-spacing:.01em}
.a-psub{font-size:12.5px;color:var(--ink-faint)}
.a-pbody{flex:1;overflow:hidden;padding:0 30px 26px}
.a-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.a-card{background:var(--sheet);border-radius:13px;padding:17px;display:flex;gap:13px;cursor:pointer}
.a-card:hover{box-shadow:0 4px 20px rgba(23,25,27,.08)}
.a-face{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:21px;font-family:var(--font-read)}
.a-name{font-size:14.5px;font-weight:500}
.a-tags{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.a-desc{font-size:12.5px;color:var(--ink-dim);margin-top:9px;line-height:1.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a-lfoot{display:flex;gap:13px;margin-top:11px}
.a-link{background:none;border:0;padding:0;font-size:12px;color:var(--ink-faint);cursor:pointer;font-family:var(--font-ui)}
.a-link.acc{color:var(--accent)}

.a-veil{position:absolute;inset:0;background:rgba(23,25,27,.34)}
.a-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:872px;height:700px;background:var(--sheet);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 76px rgba(23,25,27,.26)}
.a-mhead{padding:24px 30px 16px;display:flex;align-items:flex-start;gap:12px}
.a-mtitle{font-size:17px;font-weight:500}
.a-mnote{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.a-mbody{flex:1;overflow:hidden;padding:0 30px}
.a-mfoot{flex:0 0 66px;display:flex;align-items:center;gap:10px;padding:0 30px}
.a-fl{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:8px}
.a-inp{width:100%;height:40px;border:0;border-bottom:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:var(--font-ui);font-size:14px;display:flex;align-items:center;padding:0}
textarea.a-inp{height:auto;padding:9px 0;line-height:1.85;resize:none;display:block}
.a-tabs{display:flex;gap:4px;align-items:center;margin:20px 0 12px;border-bottom:1px solid var(--line)}
.a-tab{padding:7px 12px;font-size:13px;color:var(--ink-dim);border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;cursor:pointer;font-family:var(--font-ui)}
.a-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.a-arow{display:grid;grid-template-columns:158px 84px 1fr 116px 26px;gap:10px;align-items:center;margin-bottom:10px}
.a-arow .a-inp{height:38px}
.a-more{width:26px;height:26px;border:0;background:none;color:var(--ink-faint);cursor:pointer;display:grid;place-items:center}
.btn-a{height:36px;padding:0 20px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:13.5px;cursor:pointer;font-family:var(--font-ui)}
.gh-a{height:36px;padding:0 16px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink-dim);font-size:13.5px;cursor:pointer;font-family:var(--font-ui)}
.gh-a:hover{border-color:var(--line-strong);color:var(--ink)}
.gh-a.danger{color:var(--accent);border-color:var(--accent-line)}
.icb-a{width:30px;height:30px;border:0;border-radius:8px;background:none;color:var(--ink-faint);cursor:pointer;display:grid;place-items:center}
.icb-a:hover{background:var(--accent-soft);color:var(--accent)}

.a-float{position:absolute;right:32px;top:156px;width:288px;background:var(--sheet);border-radius:15px;overflow:hidden;box-shadow:0 20px 54px rgba(23,25,27,.18)}
.a-fhead{padding:14px 17px;display:flex;align-items:center;gap:9px}
.a-fbody{padding:2px 17px 18px;display:flex;flex-direction:column;gap:16px}
.a-cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:10px}
.a-st{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-dim);margin-bottom:6px}
.a-st b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.a-track{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.a-track i{display:block;height:100%;background:var(--accent);border-radius:2px}
.a-li{font-size:12.5px;color:var(--ink-dim);padding-left:11px;position:relative}
.a-li:before{content:"·";position:absolute;left:2px;color:var(--ink-faint)}

/* ==========================================================================
   B｜夜航
   ========================================================================== */
.b-side{width:232px;flex:0 0 232px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 14px}
.b-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.b-seal{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px}
.b-bname{font-size:14.5px;font-weight:500;letter-spacing:.06em}
.b-new{width:100%;height:38px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:13.5px;cursor:pointer;font-family:var(--font-ui)}
.b-cap{font-size:10.5px;color:var(--ink-faint);padding:20px 10px 8px;letter-spacing:.1em}
.b-list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.b-item{padding:9px 11px;border-radius:8px;font-size:13px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.b-item:hover{background:var(--sheet-2);color:var(--ink)}
.b-item.on{background:var(--accent-soft);color:var(--accent)}
.b-foot{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}

.b-main{flex:1;display:flex;flex-direction:column;background:var(--sheet);position:relative}
.b-top{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--line)}

.b-tb:hover{border-color:var(--line-strong);color:var(--ink)}

.b-scroll{flex:1;overflow:hidden;padding:22px 24px 0}
.b-read{max-width:600px}
.b-blk{margin-bottom:22px}

.b-bubble{background:var(--sheet-2);border-radius:16px;padding:16px 19px}
.b-bubble.me{background:var(--accent-soft);border-left:2px solid var(--accent)}
.b-prose{font-family:var(--font-read);font-size:16.5px;line-height:2.05;color:var(--ink);letter-spacing:.01em}

.b-prose p:last-child{margin-bottom:0}
.b-say{font-family:var(--font-ui);font-size:15px;line-height:1.9;color:var(--ink)}
.b-acts{display:flex;gap:15px;margin-top:12px;padding-left:4px}
.b-acts button{background:none;border:0;padding:0;font-size:11.5px;color:var(--ink-faint);cursor:pointer;font-family:var(--font-ui)}
.b-acts button:hover{color:var(--accent)}
.b-opts{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.b-opt{text-align:left;border:1px solid var(--line);border-radius:10px;background:none;padding:10px 14px;font-size:13.5px;color:var(--ink-dim);cursor:pointer;font-family:var(--font-ui)}
.b-opt:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}

.b-compose{flex:0 0 auto;padding:14px 24px 20px}
.b-cin{max-width:600px;display:flex;gap:10px;align-items:center}
.b-field{flex:1;height:48px;background:var(--sheet-2);border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 15px}
.b-field:focus-within{box-shadow:inset 0 0 0 1px var(--accent-line)}
.b-ph{flex:1;font-size:14px;color:var(--ink-faint)}
.b-send{height:48px;padding:0 22px;border:0;border-radius:13px;background:var(--accent);color:var(--on-accent);font-size:13.5px;cursor:pointer;font-family:var(--font-ui)}
.b-hint{max-width:600px;margin:9px 0 0 4px;font-size:11px;color:var(--ink-faint)}

.b-page{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.b-phead{padding:26px 24px 18px;display:flex;align-items:baseline;gap:12px}
.b-ptitle{font-size:20px;font-weight:500}
.b-psub{font-size:12px;color:var(--ink-faint)}
.b-pbody{flex:1;overflow:hidden;padding:0 24px 24px}
.b-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.b-card{background:var(--sheet-2);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;gap:12px;cursor:pointer}
.b-card:hover{border-color:var(--accent-line)}
.b-face{width:50px;height:50px;flex:0 0 50px;border-radius:50%;background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);display:grid;place-items:center;font-size:20px;font-family:var(--font-read)}

.b-mnote{font-size:11.5px;color:var(--ink-faint);margin-top:4px}

.b-mfoot{flex:0 0 64px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 28px}

.gh-b{height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink-dim);font-size:13.5px;cursor:pointer;font-family:var(--font-ui)}

.b-float{position:absolute;right:24px;top:136px;width:266px;background:var(--sheet-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* ==========================================================================
   C｜台账
   ========================================================================== */
.c-side{width:208px;flex:0 0 208px;background:var(--sheet-2);border-right:1px solid var(--line);display:flex;flex-direction:column}

.c-tab:hover{color:var(--ink)}
.c-tab.on{color:var(--accent);border-bottom-color:var(--accent)}

.gh-c:hover{border-color:var(--line-strong);color:var(--ink)}
.gh-c.danger{color:var(--accent);border-color:var(--accent-line)}

<body>
<div id="root"></div>

<script>
// ============================================================================
//  静态稿渲染：每页一个 frame，出图脚本按 [data-shot] 逐个截。
//  文案三方向完全一致 —— 对比时只看设计，不看内容差异。
// ============================================================================

const ICONS = {
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.3 8.3 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/>',
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H19v18H6.5A2.5 2.5 0 0 0 4 22.5Z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H19"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>',
  gear:'<path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  more:'<g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></g>',
  send:'<path d="M4 12h14M13 6l6 6-6 6"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>'
};
const ico = (n, s) => `<svg width="${s||17}" height="${s||17}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

const CHATS = ['雨夜，旧书店','选项测试：随便说点什么','顶栏生效测试','冒烟测试世界（分支）','斐法罗斯到底是个什么样'];
const CHARS = [
  ['昔','昔涟','原神 · 温婉','常来这家旧书店的姑娘，记得每一本书放在哪一格。'],
  ['艾','艾玛','原创 · 冷淡','话很少，但会在你写字的时候把灯往你这边推一点。'],
  ['林','林小雨','测试卡 · 校园','沉默寡言，成绩很好，书包里总有没还的图书馆书。'],
  ['阿','阿多利','The Fantasy World of Adolion','旅行者，口袋里装着三个国家的硬币和一张旧地图。'],
  ['裴','斐法罗斯','原创 · 世界观','不出现，只存在于别人口中的那座城。'],
  ['测','属性测试角色','测试 · 全字段','年龄性别种族属性面板一条不落，用来压边界。']
];
const ACTS = ['复制','编辑','重新生成','配图','分支','删除'];
const OPTS = ['我假装没听见，先去擦干头发','我问她这本书为什么不上架','我说：那你呢，你怎么回去'];

/* ============================ A｜墨白 ============================ */
function aRail(on){
  const nav = [['chat','对话'],['book','角色库'],['globe','世界书'],['gear','设置']];
  return `<aside class="a-rail">
    <div class="a-logo">书</div>
    <div class="a-rail-g">${nav.map(([i,t])=>`<button class="a-rail-btn ${on===i?'on':''}">${ico(i,18)}</button>`).join('')}</div>
    <div class="a-rail-g bottom"><div class="a-me">我</div></div>
  </aside>`;
}
function aTop(){
  return `<div class="a-top">
    <div><div class="a-title">雨夜，旧书店</div>
      <div class="a-sub"><span>昔涟</span><span>·</span><span>deepseek-chat</span></div></div>
    <span class="sp"></span>
    <button class="a-tb">deepseek-chat</button>
    <button class="a-tb">视角</button>
    <button class="a-tb">外观</button>
    <button class="a-tb" style="padding:0 8px">${ico('more',17)}</button>
  </div>`;
}
function aCompose(){
  return `<div class="a-compose">
    <div class="a-cin">
      <button class="a-icb">${ico('image',16)}</button>
      <span class="a-ph">说点什么……</span>
      <button class="a-send">${ico('send',16)}</button>
    </div>
    <div class="a-hint">Enter 发送 · Shift + Enter 换行</div>
  </div>`;
}
function aMsgs(withOpts, withActs){
  return `
  <div class="a-msg">
    <div class="a-who">昔涟</div>
    <div class="a-prose">
      <p>雨下到第三天，檐水连成一条不断的线。她把最后一摞旧书上架，回头看你一眼。</p>
      <p>“伞就放在门口。”她说，“你这身衣服，走到街口就湿透了。”</p>
    </div>
    ${withActs?`<div class="a-acts">${ACTS.map(a=>`<button>${a}</button>`).join('')}</div>`:''}
  </div>
  <div class="a-msg me">
    <div class="a-who">我</div>
    <div class="a-say">我在门口站了一会儿，才把伞收起来。</div>
  </div>
  <div class="a-msg">
    <div class="a-who">昔涟</div>
    <div class="a-prose"><p>她从梯子上下来，把那本没上架的书抱在怀里，露出半截褪色的书脊。</p></div>
    ${withOpts?`<div class="a-opts">
      ${OPTS.map(o=>`<button class="a-opt">${o}</button>`).join('')}
      <div class="a-opts-f"><button class="a-link">换一批</button><button class="a-link">收起</button></div>
    </div>`:''}
  </div>`;
}
const aChat = `
<div class="frame" data-dir="A" data-shot="A1-chat">
  ${aRail('chat')}
  <section class="a-main">
    ${aTop()}
    <div class="a-scroll"><div class="a-read">${aMsgs(true,true)}</div></div>
    ${aCompose()}
  </section>
</div>`;

const aLib = `
<div class="frame" data-dir="A" data-shot="A2-char-lib">
  ${aRail('book')}
  <section class="a-page">
    <div class="a-phead">
      <span class="a-ptitle">角色库</span>
      <span class="a-psub">6 张卡 · PNG / JSON 都能导</span>
      <span class="sp"></span>
      <button class="btn-a" style="align-self:center">导入角色卡</button>
    </div>
    <div class="a-pbody">
      <div class="a-grid">
        ${CHARS.map(([f,n,t,d])=>`
        <div class="a-card">
          <div class="a-face">${f}</div>
          <div>
            <div class="a-name">${n}</div>
            <div class="a-tags">${t}</div>
            <div class="a-desc">${d}</div>
            <div class="a-lfoot"><button class="a-link acc">聊天</button><button class="a-link">编辑</button><button class="a-link">导出</button></div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </section>
</div>`;

const aEditor = `
<div class="frame" data-dir="A" data-shot="A3-editor">
  ${aRail('book')}
  <section class="a-page" style="background:var(--sheet-2)"></section>
  <div class="a-veil"></div>
  <div class="a-modal">
    <div class="a-mhead">
      <div><div class="a-mtitle">编辑角色</div><div class="a-mnote">改完记得点右下角保存</div></div>
      <span class="sp"></span>
      <button class="icb-a">${ico('x',16)}</button>
    </div>
    <div class="a-mbody">
      <div style="display:flex;gap:18px;align-items:flex-start">
        <div style="width:92px;flex:0 0 92px">
          <div class="a-face" style="width:92px;height:92px;border-radius:50%;font-size:34px">林</div>
          <div style="font-size:11px;color:var(--ink-faint);text-align:center;margin-top:8px">点击换头像</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:16px;padding-top:4px">
          <div><label class="a-fl">角色名</label><div class="a-inp">林小雨</div></div>
          <div><label class="a-fl">标签</label><div class="a-inp" style="color:var(--ink-faint)">分类用，例如：校园，治愈</div></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px">
        <div><label class="a-fl">年龄</label><div class="a-inp">17</div></div>
        <div><label class="a-fl">性别</label><div class="a-inp">女</div></div>
        <div><label class="a-fl">种族</label><div class="a-inp">人类</div></div>
      </div>
      <div style="margin-top:20px">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
          <label class="a-fl" style="margin:0">角色描述</label>

      <div class="a-tabs">

        <button class="a-tab">背包</button>
        <button class="a-tab" style="color:var(--ink-faint)">＋ 新建分组</button>
      </div>
      <div class="a-arow">
        <div class="a-inp">体力</div>
        <div class="a-inp">数值</div>
        <div class="a-inp">72</div>
        <div class="a-inp" style="font-size:12.5px;color:var(--ink-faint)">0 — 100</div>
        <button class="a-more">${ico('more',16)}</button>
      </div>
      <div class="a-arow">
        <div class="a-inp">心情</div>
        <div class="a-inp">文本</div>
        <div class="a-inp">平静</div>

        <button class="a-more">${ico('more',16)}</button>

const aState = `
<div class="frame" data-dir="A" data-shot="A4-state">
  ${aRail('chat')}
